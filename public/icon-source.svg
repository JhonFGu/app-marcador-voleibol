<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded square with padding for maskable -->
  <rect x="32" y="32" width="448" height="448" rx="80" fill="#0A0A0A"/>

  <!-- Brand gradient border -->
  <rect x="32" y="32" width="448" height="448" rx="80" fill="none" stroke="url(#brandGrad)" stroke-width="8"/>

  <!-- Scoreboard screen -->
  <rect x="80" y="130" width="352" height="200" rx="32" fill="#141414" stroke="#262626" stroke-width="4"/>

  <!-- Score display: "00 : 00" -->
  <g filter="url(#glow)">
    <text x="200" y="270" font-family="monospace" font-size="72" font-weight="bold" fill="#FFFFFF" text-anchor="middle">00</text>
    <text x="312" y="270" font-family="monospace" font-size="72" font-weight="bold" fill="#FFFFFF" text-anchor="middle">00</text>
  </g>

  <!-- Colon separator -->
  <text x="256" y="268" font-family="monospace" font-size="64" font-weight="bold" fill="#F97316" text-anchor="middle">:</text>

  <!-- Team labels -->
  <rect x="100" y="340" width="60" height="16" rx="4" fill="#F97316" opacity="0.8"/>
  <text x="130" y="352" font-family="sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">LOCAL</text>
  <rect x="352" y="340" width="60" height="16" rx="4" fill="#A855F7" opacity="0.8"/>
  <text x="382" y="352" font-family="sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">VISIT.</text>

  <!-- Volleyball icon bottom-right -->
  <g transform="translate(380, 60)">
    <circle cx="20" cy="20" r="18" fill="none" stroke="#A855F7" stroke-width="3" opacity="0.6"/>
    <path d="M4,12 Q20,20 36,12" fill="none" stroke="#A855F7" stroke-width="2" opacity="0.4"/>
    <path d="M4,20 Q20,28 36,20" fill="none" stroke="#A855F7" stroke-width="2" opacity="0.4"/>
    <path d="M4,28 Q20,36 36,28" fill="none" stroke="#A855F7" stroke-width="2" opacity="0.4"/>
    <path d="M20,2 Q10,20 20,38" fill="none" stroke="#F97316" stroke-width="2" opacity="0.4"/>
    <path d="M20,2 Q30,20 20,38" fill="none" stroke="#F97316" stroke-width="2" opacity="0.4"/>
  </g>

  <!-- App name at top -->
  <text x="256" y="90" font-family="sans-serif" font-size="28" font-weight="900" fill="url(#brandGrad)" text-anchor="middle">PUNTOSVOLLEY</text>
</svg>
