<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Background - fills entire canvas -->
  <rect x="0" y="0" width="512" height="512" rx="110" fill="#0A0A0A"/>

  <!-- ===== VOLLEYBALL - 6-panel classic design ===== -->
  <g transform="translate(256, 128)">
    <!-- Translucent white fill for depth -->
    <circle cx="0" cy="0" r="78" fill="#FFFFFF" opacity="0.12"/>

    <!-- Outer circle -->
    <circle cx="0" cy="0" r="78" fill="none" stroke="#FFFFFF" stroke-width="8" opacity="0.95"/>

    <!-- 3 panel curves (6-panel classic volleyball) -->
    <!-- Curve 1: upper-left to lower-right -->
    <path d="M -68 -38 C -55 -22, -25 -8, 0 0 C 25 8, 55 22, 68 38"
          fill="none" stroke="#FFFFFF" stroke-width="5.5" opacity="0.85"/>

    <!-- Curve 2: upper-right to lower-left -->
    <path d="M 68 -38 C 55 -22, 25 -8, 0 0 C -25 8, -55 22, -68 38"
          fill="none" stroke="#FFFFFF" stroke-width="5.5" opacity="0.85"/>

    <!-- Curve 3: top to bottom (vertical S-curve) -->
    <path d="M 0 -78 C -12 -52, 10 -26, 0 0 C -10 26, 12 52, 0 78"
          fill="none" stroke="#FFFFFF" stroke-width="5.5" opacity="0.85"/>
  </g>

  <!-- ===== SCORE PANELS ===== -->
  <!-- Left panel (Local - Orange #F97316) -->
  <g>
    <rect x="30" y="222" width="218" height="248" rx="30" fill="#F97316"/>
    <text x="139" y="370" font-family="monospace" font-size="170" font-weight="bold" fill="#FFFFFF" text-anchor="middle">00</text>
  </g>

  <!-- Right panel (Visitor - Purple #A855F7) -->
  <g>
    <rect x="264" y="222" width="218" height="248" rx="30" fill="#A855F7"/>
    <text x="373" y="370" font-family="monospace" font-size="170" font-weight="bold" fill="#FFFFFF" text-anchor="middle">00</text>
  </g>
</svg>
