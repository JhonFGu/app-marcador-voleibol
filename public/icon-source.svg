<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <clipPath id="roundedBg">
      <rect x="32" y="32" width="448" height="448" rx="100"/>
    </clipPath>
  </defs>

  <!-- Dark background with rounded corners -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="#0A0A0A"/>

  <g clip-path="url(#roundedBg)">

    <!-- Subtle brand gradient at very low opacity -->
    <rect x="32" y="32" width="448" height="448" fill="url(#bgGlow)" opacity="0.15"/>

    <!-- ===== VOLLEYBALL at top center ===== -->
    <g transform="translate(256, 120)">
      <!-- Outer circle -->
      <circle cx="0" cy="0" r="52" fill="none" stroke="#FFFFFF" stroke-width="7" opacity="0.9"/>

      <!-- Panel curves (6-panel volleyball) -->
      <path d="M -45 -26 Q 0 0 45 26"   fill="none" stroke="#FFFFFF" stroke-width="5" opacity="0.7"/>
      <path d="M 45 -26 Q 0 0 -45 26"   fill="none" stroke="#FFFFFF" stroke-width="5" opacity="0.7"/>
      <path d="M 0 -52 Q -10 0 0 52"    fill="none" stroke="#FFFFFF" stroke-width="5" opacity="0.7"/>
    </g>

    <!-- ===== TWO SCORE PANELS ===== -->
    <!-- Left panel (Local - Orange) -->
    <g transform="translate(0, 0)">
      <rect x="80" y="220" width="168" height="200" rx="24" fill="#F97316"/>
      <text x="164" y="362" font-family="monospace" font-size="140" font-weight="bold" fill="#FFFFFF" text-anchor="middle">00</text>
    </g>

    <!-- Right panel (Visitor - Purple) -->
    <g transform="translate(0, 0)">
      <rect x="264" y="220" width="168" height="200" rx="24" fill="#A855F7"/>
      <text x="348" y="362" font-family="monospace" font-size="140" font-weight="bold" fill="#FFFFFF" text-anchor="middle">00</text>
    </g>

  </g>
</svg>
